[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musubi-hub-sdk"
version = "1.0.0"
description = "Python SDK for the Control Hub (JSON-RPC 2.0), zero third-party dependencies"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Musubi" }]
keywords = ["hub", "jsonrpc", "rpc", "control", "sdk"]

# No install_requires: the core SDK is dependency-free.
# WebSocket transport is optional; enable with: pip install musubi-hub-sdk[ws]
[project.optional-dependencies]
ws = ["websocket-client>=1.0"]

[project.urls]
Homepage = "https://github.com/musubi/hub"
Documentation = "https://github.com/musubi/hub/blob/main/docs/PROTOCOL.md"

[tool.setuptools]
packages = ["hub"]